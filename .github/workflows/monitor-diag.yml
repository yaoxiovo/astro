name: Monitor Diag (Read Worker KV)

on:
  workflow_dispatch:
    inputs:
      key:
        description: "KV key to read (empty = list keys)"
        required: false
        default: ""

jobs:
  diag:
    name: Read Site Monitor KV via CF API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List KV keys
        id: list
        run: |
          NS_ID=$(grep -o '"id": "[^"]*"' site-monitor/wrangler.jsonc | head -1 | sed 's/.*"id": "//;s/"//')
          echo "NS_ID from wrangler.jsonc: $NS_ID"
          if [ "$NS_ID" = "REPLACE_WITH_KV_ID" ] || [ -z "$NS_ID" ]; then
            API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
            NS_ID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);const n=(j.result||[]).find(x=>x.title==='site-monitor-kv'||x.title==='MONITOR_KV');console.log(n?n.id:'')}catch(e){console.log('')}})")
            echo "NS_ID resolved via API: $NS_ID"
          fi
          echo "ns_id=$NS_ID" >> "$GITHUB_OUTPUT"
          KEYS=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$NS_ID/keys?limit=100")
          echo "### 🔑 KV keys" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$KEYS" | head -c 4000 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Read KV value
        if: inputs.key != ''
        run: |
          NS_ID="${{ steps.list.outputs.ns_id }}"
          KEY="${{ inputs.key }}"
          ENC=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$KEY")
          VAL=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$NS_ID/values/$ENC")
          echo "KV_VALUE_START"
          echo "$VAL" | head -c 6000
          echo "KV_VALUE_END"
          echo "### 📦 KV value for \`$KEY\`" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$VAL" | head -c 6000 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}