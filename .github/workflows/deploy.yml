name: Build and Deploy Astro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    # corepack 在非交互环境下下载 packageManager 指定的 pnpm 前会要求确认，
    # 置 0 关闭该提示；这不影响任何步骤的退出码，失败仍会让工作流变红。
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (pnpm via packageManager)
        run: corepack enable

      # 必须用 pnpm：pnpm.patchedDependencies 对 astro 的补丁（patches/astro.patch）
      # 只有 pnpm 会应用，npm 会静默跳过并让构建产物与本地分叉。
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro
        run: pnpm run build
        env:
          # 官印签名私钥（Ed25519 PEM 或 base64(PEM)）；未配置时构建自动跳过签发并保留既有 manifest
          SEAL_PRIVATE_KEY: ${{ secrets.SEAL_PRIVATE_KEY }}

      - name: Deploy to Linux Server via Rsync
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST || '43.128.137.8' }}
          SERVER_USER: ${{ secrets.SERVER_USER || 'root' }}
          SERVER_TARGET_DIR: ${{ secrets.SERVER_TARGET_DIR || '/www/wwwroot/blog-api.yaoxi.wiki' }}
        run: |
          if [ -z "$SERVER_SSH_KEY" ]; then
            echo "::error::SERVER_SSH_KEY is not configured in GitHub Secrets! Please add it in Repository Settings."
            exit 1
          fi

          echo "Setting up SSH deploy key..."
          mkdir -p ~/.ssh
          python3 -c '
          import sys, base64
          raw = sys.stdin.read().strip()
          if "BEGIN" in raw:
              raw = raw.replace("\\n", "\n")
              out = raw.strip() + "\n"
          else:
              try:
                  out = base64.b64decode(raw).decode("utf-8").strip() + "\n"
              except Exception:
                  out = raw.strip() + "\n"
          with open("/tmp/deploy_key", "w") as f:
              f.write(out)
          ' <<< "$SERVER_SSH_KEY"
          mv /tmp/deploy_key ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "Validating deploy key format..."
          ssh-keygen -l -f ~/.ssh/deploy_key || { echo "::error::Private key format is invalid! Please verify SERVER_SSH_KEY secret."; exit 1; }

          echo "Testing SSH connection to $SERVER_USER@$SERVER_HOST..."
          ssh -v -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o BatchMode=yes $SERVER_USER@$SERVER_HOST "uname -a" || {
            echo "::error::SSH authentication failed! Please check if the private key matches ~/.ssh/authorized_keys on the server."
            exit 1
          }

          echo "Synchronizing static dist artifacts to $SERVER_HOST:$SERVER_TARGET_DIR..."
          rsync -avz --delete --exclude=".user.ini" --exclude=".htaccess" --exclude=".well-known" -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15" dist/ $SERVER_USER@$SERVER_HOST:$SERVER_TARGET_DIR/

          echo "Setting file permissions on remote server..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 $SERVER_USER@$SERVER_HOST "chown -R www:www $SERVER_TARGET_DIR && chmod -R 755 $SERVER_TARGET_DIR"

          echo "Deployment to Linux Server completed successfully!"

      - name: Deploy to Firebase (Optional)
        if: ${{ env.FIREBASE_TOKEN != '' }}
        uses: w9jds/firebase-action@v2.2.2
        with:
          args: deploy --only hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
