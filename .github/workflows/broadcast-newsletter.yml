name: Broadcast Newsletter (New Post)

on:
  push:
    branches:
      - main
    paths:
      - "src/content/posts/**"
  workflow_dispatch:
    inputs:
      preview:
        description: "仅发送测试预览邮件 (true/false)"
        type: boolean
        required: false
        default: false
      file:
        description: "指定广播的文章文件名 (如 expressive-code.md)，留空默认最新"
        type: string
        required: false
        default: ""

jobs:
  broadcast:
    name: Broadcast Post to Email Subscribers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Broadcast Post
        env:
          BLOG_API_BASE: "https://blog-api.yaoxi.cloud"
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          BEFORE_SHA: ${{ github.event.before }}
          # 经 env 传入而非直接插值进 run：workflow_dispatch 的输入来自用户，
          # 直接拼进 shell 会成为命令注入点。此处仅作为数据传递，shell 内始终加引号引用。
          # 非 workflow_dispatch 触发（push）时该值为空字符串，下面的 -n 判断会自动跳过。
          INPUT_PREVIEW: ${{ github.event.inputs.preview }}
          INPUT_FILE: ${{ github.event.inputs.file }}
        run: |
          ARGS=""
          if [ "$INPUT_PREVIEW" = "true" ]; then
            ARGS="$ARGS --preview"
          fi
          if [ -n "$INPUT_FILE" ]; then
            ARGS="$ARGS --file=$INPUT_FILE"
          fi
          node scripts/broadcast-post.js $ARGS
