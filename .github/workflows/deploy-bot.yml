name: Deploy Telegram Bot

on:
  push:
    branches: [main]
    paths:
      - "telegram-bot/**"
      - ".github/workflows/deploy-bot.yml"
  workflow_dispatch: # 手动触发：Actions 页面点 Run workflow

jobs:
  deploy:
    name: Deploy Bot Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-bot

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wrangler
        run: npm i -D wrangler --no-audit --no-fund

      - name: Create KV namespace (if placeholder)
        id: kv
        run: |
          if grep -q "REPLACE_WITH_KV_ID" wrangler.jsonc; then
            echo "Creating KV namespace..."
            ID=$(npx wrangler kv namespace create BOT_KV --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).result.id))")
            echo "KV ID: $ID"
            sed -i "s/REPLACE_WITH_KV_ID/$ID/" wrangler.jsonc
          else
            echo "KV already configured."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set BOT_TOKEN secret
        run: |
          if [ -n "$BOT_TOKEN" ]; then
            echo "$BOT_TOKEN" | npx wrangler secret put BOT_TOKEN
          else
            echo "BOT_TOKEN secret not set, skipping"
          fi
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set CHAT_ID secret
        run: |
          if [ -n "$CHAT_ID" ]; then
            echo "$CHAT_ID" | npx wrangler secret put CHAT_ID
          else
            echo "CHAT_ID secret not set, skipping (using wrangler.jsonc var)"
          fi
        env:
          CHAT_ID: ${{ secrets.CHAT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Setup webhook & commands
        run: |
          # 生成 webhook 校验密钥并写入 Worker secret
          WHS="whs_$(openssl rand -hex 16)"
          echo "$WHS" | npx wrangler secret put WEBHOOK_SECRET
          # 设置 webhook（消息即时推送，替代旧 getUpdates 轮询）
          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/setWebhook" \
            -H "Content-Type: application/json" \
            -d "{\"url\":\"https://yaoxi-blog-bot.yaoxiovo.workers.dev/webhook\",\"secret_token\":\"$WHS\",\"allowed_updates\":[\"message\"]}"
          # 清空旧命令菜单
          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/setMyCommands" \
            -H "Content-Type: application/json" \
            -d '{"commands":[]}'
          # 写入新命令快捷菜单（与代码 COMMANDS 一致：8 个）
          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/setMyCommands" \
            -H "Content-Type: application/json" \
            -d '{"commands":[{"command":"start","description":"开始使用 / 订阅推送"},{"command":"latest","description":"最近5条动态"},{"command":"random","description":"随机一条朋友圈"},{"command":"stats","description":"朋友圈统计"},{"command":"search","description":"搜索朋友圈"},{"command":"subscribe","description":"订阅推送"},{"command":"unsubscribe","description":"退订推送"},{"command":"help","description":"帮助"}]}'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}