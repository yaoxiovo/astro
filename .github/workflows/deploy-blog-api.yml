name: Deploy Blog API

on:
  push:
    branches: [main]
    paths:
      - "blog-api/**"
      - "scripts/deploy-blog-api.mjs"
      - ".github/workflows/deploy-blog-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-blog-api-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy Blog API to Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST || '43.128.137.8' }}
      SERVER_USER: ${{ secrets.SERVER_USER || 'root' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test comment moderation
        run: node --test tests/tencent-tms.test.mjs tests/comments.test.mjs tests/ddos-auth.test.mjs

      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          test -n "$SERVER_SSH_KEY" || { echo "::error::SERVER_SSH_KEY is required"; exit 1; }
          mkdir -p ~/.ssh
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          raw = os.environ['SERVER_SSH_KEY'].strip()
          value = raw.replace('\\n', '\n') if 'BEGIN' in raw else base64.b64decode(raw).decode()
          p = Path.home() / '.ssh/deploy_key'
          p.write_text(value.strip() + '\n')
          p.chmod(0o600)
          PY
          ssh-keygen -l -f ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      # Production DNS points to Linux. Apply committed API changes without
      # overwriting runtime migration fixes or existing service credentials.
      - name: Deploy committed API changes and verify Tencent TMS
        run: |
          set -euo pipefail
          target="$SERVER_USER@$SERVER_HOST"
          baseline=$(ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 "$target" 'cat /opt/yaoxi-workers/.blog-api-deploy-sha 2>/dev/null || true')
          baseline="${baseline:-8dc110e606dbbb10266ce557f41ad9f322cd94ec}"
          [[ "$baseline" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid deployed revision"; exit 1; }
          git cat-file -e "$baseline^{commit}"
          mkdir -p /tmp/blog-api-release
          git diff --binary "$baseline" "$GITHUB_SHA" -- blog-api/src/ > /tmp/blog-api-release/changes.patch
          git diff --name-only -z "$baseline" "$GITHUB_SHA" -- blog-api/src/ > /tmp/blog-api-release/changed-paths
          cp scripts/deploy-blog-api.mjs /tmp/blog-api-release/
          tar -C /tmp/blog-api-release -czf - changes.patch changed-paths deploy-blog-api.mjs |
            ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 "$target" \
              "set -eu; release=\$(mktemp -d /tmp/blog-api-release.XXXXXX); trap 'rm -rf \"\$release\"' EXIT; tar -xzf - -C \"\$release\"; node \"\$release/deploy-blog-api.mjs\" \"\$release\" '$GITHUB_SHA'"
