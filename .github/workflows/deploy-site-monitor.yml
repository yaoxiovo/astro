name: Deploy Site Monitor

on:
  push:
    branches: [main]
    paths:
      - "site-monitor/**"
      - ".github/workflows/deploy-site-monitor.yml"
  workflow_dispatch: # 手动触发：Actions 页面点 Run workflow

jobs:
  deploy:
    name: Deploy Monitor Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site-monitor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wrangler
        run: npm i -D wrangler --no-audit --no-fund

      - name: Resolve or create KV namespace
        id: kv
        run: |
          if grep -q "REPLACE_WITH_KV_ID" wrangler.jsonc; then
            # 1) 优先复用已存在的 namespace（手动创建 or 之前创建）
            LIST_OUT=$(npx wrangler kv namespace list --json 2>/tmp/kv_list_err.txt || true)
            ID=$(echo "$LIST_OUT" | node -e "let s=require('fs').readFileSync(0,'utf8');try{const j=JSON.parse(s);const n=(j||[]).find(x=>x.title==='site-monitor-kv'||x.title==='MONITOR_KV');if(n){console.log(n.id)}else{process.exit(1)}}catch(e){process.exit(1)}" 2>/dev/null || true)
            if [ -z "$ID" ]; then
              echo "::error::KV_LIST_RESULT: LIST_OUT=[$LIST_OUT] ERR=$(head -c 1000 /tmp/kv_list_err.txt 2>/dev/null)"
              echo "Existing KV not found, creating a new one..."
              npx wrangler kv namespace create MONITOR_KV --json > /tmp/kv_out.json 2>/tmp/kv_err.txt
              if [ $? -ne 0 ]; then
                echo "### ❌ KV namespace 创建失败" >> $GITHUB_STEP_SUMMARY
                echo "请检查 CLOUDFLARE_API_TOKEN 是否包含 **Workers KV Storage: Edit** 权限（Account 级）" >> $GITHUB_STEP_SUMMARY
                echo "或手动在 Cloudflare Dashboard 创建 KV 后重跑本 workflow（会自动复用 site-monitor-kv）" >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY
                cat /tmp/kv_err.txt >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY
                echo "::error::KV_CREATE_FAIL: $(head -c 2000 /tmp/kv_err.txt)"
                exit 1
              fi
              ID=$(node -e "let s=require('fs').readFileSync('/tmp/kv_out.json','utf8');const j=JSON.parse(s);if(j.success===false){console.error(s);process.exit(1)}console.log((j.result||j).id)")
            else
              echo "Reusing existing KV: $ID"
            fi
            echo "KV ID: $ID"
            sed -i "s/REPLACE_WITH_KV_ID/$ID/" wrangler.jsonc
          else
            echo "KV already configured."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set BOT_TOKEN secret (reuse yaoxi-blog-bot token)
        run: |
          if [ -n "$BOT_TOKEN" ]; then
            echo "$BOT_TOKEN" | npx wrangler secret put BOT_TOKEN
          else
            echo "BOT_TOKEN secret not set, skipping"
          fi
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set CHAT_ID secret
        run: |
          if [ -n "$CHAT_ID" ]; then
            echo "$CHAT_ID" | npx wrangler secret put CHAT_ID
          else
            echo "CHAT_ID secret not set, skipping (using wrangler.jsonc var)"
          fi
        env:
          CHAT_ID: ${{ secrets.CHAT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set MONITOR_SECRET (protect manual trigger)
        run: |
          if [ -n "$MONITOR_SECRET" ]; then
            echo "$MONITOR_SECRET" | npx wrangler secret put MONITOR_SECRET
          else
            echo "MONITOR_SECRET not set, skipping"
          fi
        env:
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set FLASHCAT_INTEGRATION_KEY (Flashduty standard alert)
        run: |
          if [ -n "$FLASHCAT_INTEGRATION_KEY" ]; then
            echo "$FLASHCAT_INTEGRATION_KEY" | npx wrangler secret put FLASHCAT_INTEGRATION_KEY
          else
            echo "FLASHCAT_INTEGRATION_KEY not set, skipping"
          fi
        env:
          FLASHCAT_INTEGRATION_KEY: ${{ secrets.FLASHCAT_INTEGRATION_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}