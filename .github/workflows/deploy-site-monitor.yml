name: Deploy Site Monitor

on:
  push:
    branches: [main]
    paths:
      - "site-monitor/**"
      - ".github/workflows/deploy-site-monitor.yml"
  workflow_dispatch: # 手动触发：Actions 页面点 Run workflow

jobs:
  deploy:
    name: Deploy Monitor Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site-monitor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wrangler
        run: npm i -D wrangler --no-audit --no-fund

      - name: Resolve or create KV namespace
        id: kv
        run: |
          if grep -q "REPLACE_WITH_KV_ID" wrangler.jsonc; then
            API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
            # 1) 优先复用已存在的 namespace（手动创建 or 之前创建）
            NS_LIST=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API")
            ID=$(echo "$NS_LIST" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);const n=(j.result||[]).find(x=>x.title==='site-monitor-kv'||x.title==='MONITOR_KV');if(n)console.log(n.id);else process.exit(1)}catch(e){process.exit(1)}})" 2>/dev/null || true)
            if [ -z "$ID" ]; then
              echo "::error::KV_LIST_RESP=$(echo "$NS_LIST" | head -c 800 | tr '\n' ' ')"
              echo "Existing KV not found, creating a new one..."
              CREATE_OUT=$(curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$API" -d '{"title":"MONITOR_KV"}')
              ID=$(echo "$CREATE_OUT" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);if(j.success!==true){console.error(JSON.stringify(j.errors));process.exit(1)}console.log(j.result.id)}catch(e){process.exit(1)}})" 2>/dev/null || true)
              if [ -z "$ID" ]; then
                echo "::error::KV_CREATE_RESP=$(echo "$CREATE_OUT" | head -c 1200 | tr '\n' ' ')"
                echo "### ❌ KV namespace 创建失败" >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY
                echo "$CREATE_OUT" >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY
                exit 1
              fi
            else
              echo "Reusing existing KV: $ID"
            fi
            echo "KV ID: $ID"
            sed -i "s/REPLACE_WITH_KV_ID/$ID/" wrangler.jsonc
          else
            echo "KV already configured."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set BOT_TOKEN secret (reuse yaoxi-blog-bot token)
        run: |
          if [ -n "$BOT_TOKEN" ]; then
            echo "$BOT_TOKEN" | npx wrangler secret put BOT_TOKEN
          else
            echo "BOT_TOKEN secret not set, skipping"
          fi
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set CHAT_ID secret
        run: |
          if [ -n "$CHAT_ID" ]; then
            echo "$CHAT_ID" | npx wrangler secret put CHAT_ID
          else
            echo "CHAT_ID secret not set, skipping (using wrangler.jsonc var)"
          fi
        env:
          CHAT_ID: ${{ secrets.CHAT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

        - name: Set ADMIN_TOKEN (protect /api/run, /api/sp-test, /api/diag, /api/history)
          run: |
            if [ -n "$ADMIN_TOKEN" ]; then
              echo "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN
            else
              echo "ADMIN_TOKEN not set, skipping — management endpoints will be open!"
            fi
          env:
            ADMIN_TOKEN: ${{ secrets.SITE_MONITOR_ADMIN_TOKEN }}
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}